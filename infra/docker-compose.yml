services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teamswarm
      POSTGRES_USER: teamswarm
      POSTGRES_PASSWORD: teamswarm
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: teamswarm
      MINIO_ROOT_PASSWORD: teamswarm-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgresql12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: teamswarm
      POSTGRES_PWD: teamswarm
    depends_on: [postgres]
    ports: ["7233:7233"]

volumes:
  postgres_data:
  minio_data:
